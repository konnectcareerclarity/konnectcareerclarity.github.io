<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Career Discovery Assessment | Konnect Career Clarity</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#1F3864;--navy2:#13294b;--blue:#2E75B6;--gold:#F0A500;--teal:#1D9E75;--ink:#26364a;--muted:#66758a;--bg:#F5F8FC;--line:#dfe7f0;--white:#fff;--warn:#C0392B}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Poppins',system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:0 16px 80px;-webkit-text-size-adjust:100%}
.top{width:100%;max-width:680px;display:flex;align-items:center;justify-content:space-between;padding:14px 0 10px}
.top img{height:38px;width:auto;border-radius:6px}
.top .tag{font-size:12px;color:var(--muted);text-align:right}
.bar{width:100%;max-width:680px;margin-bottom:6px}
.bar .meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:6px}
.track{height:8px;background:#e3eaf3;border-radius:8px;overflow:hidden}
.fill{height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--teal));border-radius:8px;transition:width .3s}
.card{width:100%;max-width:680px;background:var(--white);border:1px solid var(--line);border-radius:18px;padding:24px 20px;margin-top:12px;box-shadow:0 6px 24px rgba(31,56,100,.06)}
h1{font-size:24px;line-height:1.25;color:var(--navy);margin:0 0 10px}
h2{font-size:19px;color:var(--navy);margin:0 0 6px}
p{line-height:1.6;margin:0 0 12px;font-size:15px}
.sub{color:var(--muted);font-size:14px}
.pill{display:inline-block;background:#E8F1FA;color:var(--blue);font-weight:600;font-size:12px;border-radius:20px;padding:4px 12px;margin-bottom:12px}
.q{padding:16px 0;border-top:1px solid var(--line)}
.q:first-of-type{border-top:0;padding-top:4px}
.qn{font-size:12.5px;font-weight:600;color:var(--blue);margin-bottom:6px;letter-spacing:.02em}
.qt{font-size:15.5px;font-weight:500;line-height:1.5;margin-bottom:12px;white-space:pre-line}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scale button{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:10px 2px;font:600 15px 'Poppins';color:var(--navy);cursor:pointer;min-height:46px}
.scale button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.ends{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:6px}
.opts{display:flex;flex-direction:column;gap:8px}
.likert{gap:6px}
.likert .opt{padding:9px 12px;align-items:center;min-height:42px;font-size:14.5px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:12px 14px;font:500 15px/1.4 'Poppins';color:var(--ink);cursor:pointer;width:100%;min-height:48px}
.opt .k{flex:0 0 26px;height:26px;border-radius:50%;background:#E8F1FA;color:var(--blue);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
.opt.on{border-color:var(--navy);background:#EEF3FA}
.opt.on .k{background:var(--navy);color:#fff}
.optrow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.optrow .opt{justify-content:center;padding:12px 4px}
img.fig{display:block;max-width:100%;height:auto;margin:6px auto 10px;border:1px solid var(--line);border-radius:10px;background:#fff}
table.t{border-collapse:collapse;margin:8px 0 12px;font-size:14px;width:100%}
table.t td,table.t th{border:1px solid var(--line);padding:7px 9px;text-align:center}
table.t th{background:#EEF3FA;color:var(--navy)}
.skip{background:none;border:0;color:var(--muted);font:500 13px 'Poppins';text-decoration:underline;cursor:pointer;padding:10px 0 0}
.nav{width:100%;max-width:680px;display:flex;gap:10px;margin-top:14px}
.btn{flex:1;border:0;border-radius:12px;padding:14px 18px;font:600 15px 'Poppins';cursor:pointer;min-height:50px}
.btn.p{background:var(--navy);color:#fff}
.btn.s{background:#fff;color:var(--navy);border:1.5px solid var(--line);flex:0 0 100px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.hint{font-size:12.5px;color:var(--muted);text-align:center;margin-top:8px;min-height:18px}
label.f{display:block;font-size:13px;font-weight:600;color:var(--navy);margin:14px 0 6px}
input.in,select.in,textarea.in{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:12px;font:15px 'Poppins';color:var(--ink);background:#fff}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.5;margin:12px 0}
.chk input{margin-top:4px;width:20px;height:20px;flex:0 0 20px}
.note{background:#FFF8E6;border:1px solid #F4DE9E;border-radius:12px;padding:12px 14px;font-size:13.5px;line-height:1.55;margin:12px 0}
.ok{background:#E9F7F1;border-color:#BFE5D4}
.err{color:var(--warn);font-size:13px;margin-top:6px;min-height:16px}
ul.l{margin:0 0 12px 18px;padding:0;font-size:14.5px;line-height:1.7}
@media(min-width:560px){h1{font-size:28px}.card{padding:30px 30px}}
</style>
</head>

; C) tiny; D) costly", "f89": true, "f1012": true, "diag": ""}, {"id": "APT-V2", "sec": "Aptitude", "con": "Verbal reasoning", "text": "Choose the word that is opposite in meaning to EXPAND.", "fmt": "Multiple choice A-D, one correct", "opts": "A) shrink; B) grow; C) stretch; D) spread", "f89": true, "f1012": true, "diag": ""}, {"id": "APT-V3", "sec": "Aptitude", "con": "Verbal reasoning", "text": "Doctor is to hospital as teacher is to ______.", "fmt": "Multiple choice A-D, one correct", "opts": "A) student; B) book; C) exam; D) school", "f89": true, "f1012": true, "diag": ""}, {"id": "APT-V4", "sec": "Aptitude", "con": "Verbal reasoning", "text": "Choose the word that best completes the sentence.\nAlthough the instructions were ______, Meera understood them quickly and finished the task without any help.", "fmt": "Multiple choice A-D, one correct", "opts": "A) simple; B) helpful; C) confusing; D) short", "f89": true, "f1012": true, "diag": ""}, {"id": "APT-V5", "sec": "Aptitude", "con": "Verbal reasoning", "text": "Which word does not belong with the others?", "fmt": "Multiple choice A-D, one correct", "opts": "A) shout; B) whisper; C) murmur; D) mutter", "f89": true, "f1012": true, "diag": ""}, {"id": "APT-V6", "sec": "Aptitude", "con": "Verbal reasoning", "text": "Read the passage and answer the question.\nPassage: Honeybees tell each other where food is by performing a movement called the waggle dance. The angle of the dance shows the direction of the food in relation to the sun, and the length of the dance shows how far away it is. Bees watching the dance can then fly straight to the food.", "fmt": "Multiple choice A-D, one correct", "opts": "A) Which direction the food is in; B) What kind of flower the food comes from; C) How many bees should go to the food; D) How far away the food is", "f89": true, "f1012": true, "diag": ""}, {"id": "APT-V7", "sec": "Aptitude", "con": "Verbal reasoning", "text": "All writers who attended the workshop improved their style. Rohan did not improve his style.\nWhich statement must be true?", "fmt": "Multiple choice A-D, one correct", "opts": "A) Rohan is not a writer.; B) Rohan did not attend the workshop.; C) Rohan is not a writer, or he did not attend the workshop (or both).; D) Rohan attended the workshop but did not try hard.", "f89": false, "f1012": true, "diag": ""}, {"id": "APT-V8", "sec": "Aptitude", "con": "Verbal reasoning", "text": "Choose the word that best completes the sentence.\nThe politician’s reply was deliberately ______, so that nobody could tell whether he agreed or disagreed.", "fmt": "Multiple choice A-D, one correct", "opts": "A) candid; B) evasive; C) emphatic; D) eloquent", "f89": false, "f1012": true, "diag": ""}, {"id": "APT-N1", "sec": "Aptitude", "con": "Numerical and data reasoning", "text": "A notebook costs ₹45. What is the cost of 6 notebooks?", "fmt": "Multiple choice A-D, one correct", "opts": "A) ₹240; B) ₹260; C) ₹270; D) ₹300", "f89": true, "f1012": true, "diag": ""}, {"id": "APT-N2", "sec": "Aptitude", "con": "Numerical and data reasoning", "text": "What number comes next?\n4, 8, 12, 16, ?", "fmt": "Multiple choice A-D, one correct", "opts": "A) 18; B) 20; C) 22; D) 24", "f89": true, "f1012": true, "diag": ""}, {"id": "APT-N3", "sec": "Aptitude", "con": "Numerical and data reasoning", "text": "What is 25% of 240?", "fmt": "Multiple choice A-D, one correct", "opts": "A) 80; B) 40; C) 50; D) 60", "f89": true, "f1012": true, "diag": ""}, {"id": "APT-N4", "sec": "Aptitude", "con": "Numerical and data reasoning", "text": "Aman and Bina share ₹900 in the ratio 2 : 3. How much does Bina get?", "fmt": "Multiple choice A-D, one correct", "opts": "A) ₹540; B) ₹360; C) ₹450; D) ₹600", "f89": true, "f1012": true, "diag": ""}, {"id": "APT-N5", "sec": "Aptitude", "con": "Numerical and data reasoning", "text": "A bus travels 180 km in 3 hours at a steady speed. How far will it travel in 5 hours at the same speed?", "fmt": "Multiple choice A-D, one correct", "opts": "A) 270 km; B) 360 km; C) 300 km; D) 400 km", "f89": true, "f1012": true, "diag": ""}, {"id": "APT-N6", "sec": "Aptitude", "con": "Numerical and data reasoning", "text": "The table shows the runs scored by four players in three matches. Which player scored the most runs in total?\nTable (runs in Match 1, 2, 3): Imran 34, 28, 45; Jaspreet 52, 31, 19; Karan 40, 38, 33; Lakshmi 25, 47, 36", "fmt": "Multiple choice A-D, one correct", "opts": "A) Imran; B) Karan; C) Jaspreet; D) Lakshmi", "f89": true, "f1012": true, "diag": ""}, {"id": "APT-N7", "sec": "Aptitude", "con": "Numerical and data reasoning", "text": "The chart shows the number of books sold by a bookshop. By what percentage did the sales fall from March to April?", "fmt": "Multiple choice A-D, one correct", "opts": "A) 25%; B) 20%; C) 30%; D) 10%", "f89": false, "f1012": true, "diag": "n7.png"}, {"id": "APT-N8", "sec": "Aptitude", "con": "Numerical and data reasoning", "text": "A shopkeeper marks a shirt 20% above its cost price of ₹500. He then gives a 10% discount on the marked price. What is his profit percentage?", "fmt": "Multiple choice A-D, one correct", "opts": "A) 5%; B) 10%; C) 12%; D) 8%", "f89": false, "f1012": true, "diag": ""}, {"id": "APT-L1", "sec": "Aptitude", "con": "Logical and abstract reasoning", "text": "Which letter comes next?\nA, C, E, G, ?", "fmt": "Multiple choice A-D, one correct", "opts": "A) H; B) I; C) J; D) K", "f89": true, "f1012": true, "diag": ""}, {"id": "APT-L2", "sec": "Aptitude", "con": "Logical and abstract reasoning", "text": "Which number does not belong with the others?", "fmt": "Multiple choice A-D, one correct", "opts": "A) 6; B) 12; C) 25; D) 18", "f89": true, "f1012": true, "diag": ""}, {"id": "APT-L3", "sec": "Aptitude", "con": "Logical and abstract reasoning", "text": "Which arrow comes next in the series?", "fmt": "Multiple choice A-D, one correct", "opts": "Four diagram options, A to B to C to D (see diagram file)", "f89": true, "f1012": true, "diag": "l3.png; l3_opts.png"}, {"id": "APT-L4", "sec": "Aptitude", "con": "Logical and abstract reasoning", "text": "In a certain code, CAT is written as DBU. How is DOG written in the same code?", "fmt": "Multiple choice A-D, one correct", "opts": "A) ENH; B) DPH; C) FQI; D) EPH", "f89": true, "f1012": true, "diag": ""}, {"id": "APT-L5", "sec": "Aptitude", "con": "Logical and abstract reasoning", "text": "Priya is taller than Neha. Neha is taller than Zoya. Maya is shorter than Zoya.\nWho is the second tallest?", "fmt": "Multiple choice A-D, one correct", "opts": "A) Priya; B) Neha; C) Zoya; D) Maya", "f89": true, "f1012": true, "diag": ""}, {"id": "APT-L6", "sec": "Aptitude", "con": "Logical and abstract reasoning", "text": "Which figure comes next in the series?", "fmt": "Multiple choice A-D, one correct", "opts": "Four diagram options, A to B to C to D (see diagram file)", "f89": true, "f1012": true, "diag": "l6.png; l6_opts.png"}, {"id": "APT-L7", "sec": "Aptitude", "con": "Logical and abstract reasoning", "text": "Which figure completes the pattern?", "fmt": "Multiple choice A-D, one correct", "opts": "Four diagram options, A to B to C to D (see diagram file)", "f89": false, "f1012": true, "diag": "l7.png; l7_opts.png"}, {"id": "APT-L8", "sec": "Aptitude", "con": "Logical and abstract reasoning", "text": "Four friends, Arjun, Bhavna, Chirag and Divya, each own a different pet: a dog, a cat, a parrot or a rabbit.\n1. Arjun owns neither the dog nor the cat.\n2. Bhavna owns neither the rabbit nor the cat.\n3. Chirag owns neither the rabbit nor the dog.\n4. Divya owns neither the parrot nor the dog.\n5. Chirag does not own the parrot.\nWho owns the rabbit?", "fmt": "Multiple choice A-D, one correct", "opts": "A) Divya; B) Arjun; C) Bhavna; D) Chirag", "f89": false, "f1012": true, "diag": ""}, {"id": "APT-S1", "sec": "Aptitude", "con": "Spatial reasoning", "text": "Imagine a mirror standing on the right-hand side of the shape below. Which option shows its mirror image?", "fmt": // ===== State =====
let S = {stage:"start", answers:{}, profile:{}, page:0, assent:false};
let PAGES = [];
let token = null, demo = false;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const byId = Object.fromEntries(BANK.map(b => [b.id, b]));
const OPTIONAL = new Set(["CTX-4","CTX-5","CTX-6"]);

function key(){ return "kccTest_"+(token||"x"); }
function save(){ try{ localStorage.setItem(key(), JSON.stringify(S)); }catch(e){} }
function load(){ try{ const r = localStorage.getItem(key()); if(r){ const d = JSON.parse(r); if(d && d.answers) S = d; } }catch(e){} }

function grade(){ return parseInt(S.profile.grade||"10",10); }
function inForm(b){ return grade()<=9 ? b.f89 : b.f1012; }

// Deterministic round-robin so the six interest types are mixed and the order never changes on resume
function interleaveInterests(list){
  const g = {}; list.forEach(b => (g[b.id[4]] = g[b.id[4]] || []).push(b));
  const out = [], keys = "RIASEC".split("");
  for(let i=0;i<8;i++) keys.forEach(k => { if(g[k] && g[k][i]) out.push(g[k][i]); });
  return out;
}
function chunk(a,n){ const o=[]; for(let i=0;i<a.length;i+=n) o.push(a.slice(i,i+n)); return o; }

function buildPages(){
  const f = BANK.filter(inForm);
  const pick = p => f.filter(b => b.id.startsWith(p));
  const P = [];
  const add = (part, sitting, items, intro) => P.push({part, sitting, items:items.map(b=>b.id), intro});
  P.push({part:"Part 1 of 5: Your interests", sitting:1, items:[], intro:{title:"Part 1: Your interests", body:"You will see short statements about activities. Choose how much each one is like you. There are no right or wrong answers. Go with your first feeling."}});
  chunk(interleaveInterests(pick("INT-")),1).forEach(c => add("Part 1 of 5: Your interests",1,c));
  P.push({part:"Part 2 of 5: Your strengths", sitting:1, items:[], intro:{title:"Part 2: Your strengths", body:"Now tell us how much each statement is like you. Think about how you really are, not how you would like to be."}});
  const mi = pick("MI-"); chunk(mi,1).forEach(c => add("Part 2 of 5: Your strengths",1,c));
  P.push({part:"Break", sitting:1, items:[], pause:true, intro:{title:"Good place for a break", body:"You have finished Parts 1 and 2. Your answers are saved on this device. You can close this page and come back later using the same link. Part 3 has puzzle-style questions, so take it when you feel fresh."}});
  P.push({part:"Part 3 of 5: Puzzles", sitting:2, items:[], intro:{title:"Part 3: Puzzles", body:"These questions have one correct answer each. Some are easy and some are harder, so do not worry if you cannot solve all of them. There is no time limit, but work at a steady pace. If you are not sure, you can skip a question."}});
  pick("APT-").forEach(b => add("Part 3 of 5: Puzzles",2,[b]));
  P.push({part:"Part 4 of 5: How you study and work", sitting:2, items:[], intro:{title:"Part 4: How you study and work", body:"A few more statements about how you like to study, work and what matters to you."}});
  const swv = pick("STU-").concat(pick("WS-"), pick("VAL-")); chunk(swv,1).forEach(c => add("Part 4 of 5: How you study and work",2,c));
  P.push({part:"Part 5 of 5: About you", sitting:2, items:[], intro:{title:"Part 5: About you", body:"A few questions about your school and plans. These help us make your report more useful. They are not scored."}});
  pick("CTX-").forEach(b => add("Part 5 of 5: About you",2,[b]));
  PAGES = P;
}

function optList(b){
  if(!b.opts) return [];
  const parts = b.opts.split(";").map(s => s.trim()).filter(Boolean);
  return parts.map(p => { const m = p.match(/^([A-D])\)\s*(.*)$/); return m ? {k:m[1], t:m[2]} : {k:null, t:p}; });
}
function ctxText(b){
  if(b.id==="CTX-1"){ return grade()<=9 ? "Which stream do you think you may choose after Grade 10?" : "Which stream are you in, or planning to take after Grade 10?"; }
  return b.text;
}
function tableFromText(t){
  const m = t.match(/^Table \(([^)]*)\):\s*(.*)$/m);
  if(!m) return {text:t, html:""};
  const heads = m[1].replace(/^runs in /i,"").split(/,\s*/);
  const rows = m[2].split(/;\s*/).map(r => { const x = r.match(/^(\S+)\s+(.*)$/); return [x[1]].concat(x[2].split(/,\s*/)); });
  const h = "<table class='t'><tr><th></th>"+heads.map(x=>"<th>"+esc(x)+"</th>").join("")+"</tr>"+rows.map(r=>"<tr><td><b>"+esc(r[0])+"</b></td>"+r.slice(1).map(c=>"<td>"+esc(c)+"</td>").join("")+"</tr>").join("")+"</table>";
  return {text:t.replace(m[0],"").trim(), html:h};
}

function qNumber(id){
  const ids = PAGES.flatMap(p => p.items); const i = ids.indexOf(id);
  return i<0 ? "" : "<div class='qn'>Question "+(i+1)+" of "+ids.length+"</div>";
}
function renderItem(b){
  const a = S.answers[b.id];
  let h = "<div class='q' data-id='"+b.id+"'>"+qNumber(b.id);
  if(b.sec==="Aptitude"){
    const tb = tableFromText(b.text);
    h += "<div class='qt'>"+esc(tb.text)+"</div>"+tb.html;
    const files = b.diag ? b.diag.split(";").map(s=>s.trim()) : [];
    files.forEach(f => { if(IMGS[f]) h += "<img class='fig' alt='Diagram' src='"+IMGS[f]+"'>"; });
    const ol = optList(b);
    if(ol.length===4 && ol[0].k){
      h += "<div class='opts'>"+ol.map(o=>"<button class='opt"+(a===o.k?" on":"")+"' data-v='"+o.k+"'><span class='k'>"+o.k+"</span><span>"+esc(o.t)+"</span></button>").join("")+"</div>";
    } else {
      h += "<div class='optrow'>"+"ABCD".split("").map(k=>"<button class='opt"+(a===k?" on":"")+"' data-v='"+k+"'>"+k+"</button>").join("")+"</div>";
    }
    h += "<button class='skip' data-skip='1'>"+(a==="SKIP"?"Skipped. Tap an answer to change":"I am not sure, skip this question")+"</button>";
  } else if(b.fmt.startsWith("Agreement")||b.fmt.startsWith("Self-rating")){
    h += "<div class='qt'>"+esc(b.text)+"</div><div class='opts likert'>"+LIKE.map((t,i)=>{ const n=i+1; return "<button class='opt"+(String(a)===String(n)?" on":"")+"' data-v='"+n+"'><span class='k'>"+n+"</span><span>"+esc(t)+"</span></button>"; }).join("")+"</div>";
  } else if(b.fmt.startsWith("Multi")){
    const ol = optList(b); const sel = Array.isArray(a)?a:[];
    h += "<div class='qt'>"+esc(b.text)+"</div><div class='opts'>"+ol.map(o=>"<button class='opt"+(sel.includes(o.t)?" on":"")+"' data-m='"+esc(o.t)+"'><span class='k'>"+(sel.includes(o.t)?"✓":"")+"</span><span>"+esc(o.t)+"</span></button>").join("")+"</div>";
  } else {
    const ol = optList(b);
    h += "<div class='qt'>"+esc(ctxText(b))+"</div><div class='opts'>"+ol.map(o=>"<button class='opt"+(a===o.t?" on":"")+"' data-v='"+esc(o.t)+"'><span class='k'>"+(a===o.t?"✓":"")+"</span><span>"+esc(o.t)+"</span></button>").join("")+"</div>";
    if(b.id==="CTX-5") h += "<label class='f'>If you have a career in mind, which one? (optional)</label><input class='in' data-text='CTX-5t' maxlength='80' value='"+esc(S.answers["CTX-5t"]||"")+"'>";
    if(OPTIONAL.has(b.id)) h += "<button class='skip' data-skip='1'>"+(a==="SKIP"?"Skipped. Tap an answer to change":"Prefer not to answer")+"</button>";
  }
  return h+"</div>";
}

function required(b){ return !OPTIONAL.has(b.id) && !(b.sec==="Aptitude"); }
function answered(id){
  const a = S.answers[id]; if(a===undefined||a===null||a==="") return false;
  if(Array.isArray(a)) return a.length>0; return true;
}
function pageComplete(p){ return p.items.every(id => { const b=byId[id]; return !required(b) || answered(id); })
  && p.items.every(id => { const b=byId[id]; return b.sec!=="Aptitude" || answered(id); })
  && p.items.every(id => { const b=byId[id]; return !OPTIONAL.has(id) || answered(id); }); }
function counts(){
  const ids = PAGES.flatMap(p => p.items);
  return {done: ids.filter(answered).length, total: ids.length};
}

function head(){
  const p = PAGES[S.page]; const c = counts();
  $("bar").style.display = ""; $("partName").textContent = p.part==="Break" ? "Break" : p.part;
  $("cnt").textContent = c.done+" of "+c.total+" answered";
  $("fill").style.width = Math.round(c.done/c.total*100)+"%";
}

function render(){
  const card = $("card"), nav = $("nav"), next = $("next"), back = $("back");
  $("hint").textContent = "";
  if(S.stage==="start"){
    $("bar").style.display="none"; nav.style.display="none";
    card.innerHTML = "<span class='pill'>FOR STUDENTS IN GRADES 8 TO 12</span><h1>Career Discovery Assessment</h1>"+
     "<p>This assessment helps you understand your interests, strengths and how you like to study and work, so you can make better choices about subjects, streams and careers.</p>"+
     "<ul class='l'><li>It takes about 45 to 60 minutes. You can take a break after Part 2.</li><li>Your answers are saved on this device, so you can stop and continue later with the same link.</li><li>There are no right or wrong answers in most parts. Be honest, not perfect.</li><li>Each link can be used to complete the assessment once.</li></ul>"+
     "<div class='note'>This assessment is designed for career exploration and guidance. It is not a diagnosis and should not be the only basis for decisions about your stream or career.</div>"+
     "<button class='btn p' id='go' style='width:100%;margin-top:6px'>Let us begin</button>";
    $("go").onclick = () => { S.stage="assent"; save(); render(); window.scrollTo(0,0); };
    return;
  }
  if(S.stage==="assent"){
    nav.style.display="none"; $("bar").style.display="none";
    card.innerHTML = "<h1>Before you start</h1><p class='sub'>Please read this carefully.</p>"+
     "<ul class='l'><li>Your parent or guardian has agreed to this assessment when your link was purchased.</li><li>We use your answers only to prepare your career report. We do not sell your information.</li><li>Your report will be reviewed by Konnect Career Clarity and sent to the email used at purchase.</li><li>You can stop at any time.</li></ul>"+
     "<label class='chk'><input type='checkbox' id='as'"+(S.assent?" checked":"")+"><span>I understand and I am happy to take this assessment.</span></label><div class='err' id='e'></div>"+
     "<button class='btn p' id='go' style='width:100%'>Continue</button>";
    $("go").onclick = () => { if(!$("as").checked){ $("e").textContent="Please tick the box to continue."; return; } S.assent=true; S.stage="profile"; save(); render(); window.scrollTo(0,0); };
    return;
  }
  if(S.stage==="profile"){
    nav.style.display="none"; $("bar").style.display="none";
    const p = S.profile;
    card.innerHTML = "<h1>About you</h1><p class='sub'>This is used to build your report.</p>"+
     "<label class='f'>Your name</label><input class='in' id='pn' maxlength='60' value='"+esc(p.name||"")+"'>"+
     "<label class='f'>Which grade are you in now?</label><div class='sub' style='margin:-2px 0 6px'>Choose your current grade carefully. It cannot be changed once you start.</div><select class='in' id='pg'><option value=''>Choose</option>"+[8,9,10,11,12].map(g=>"<option value='"+g+"'"+(String(p.grade)===String(g)?" selected":"")+">Grade "+g+"</option>").join("")+"</select>"+
     "<label class='f'>Your state</label><select class='in' id='ps'><option value=''>Choose</option>"+STATES.map(s=>"<option"+(p.state===s?" selected":"")+">"+s+"</option>").join("")+"</select>"+
     "<label class='f'>Where are you planning to study after school?</label><select class='in' id='pp'><option value=''>Choose</option>"+["India","Abroad","Not sure yet"].map(x=>"<option"+(p.plan===x?" selected":"")+">"+x+"</option>").join("")+"</select>"+
     "<label class='f'>Your city or town</label><input class='in' id='pc' maxlength='60' value='"+esc(p.city||"")+"'>"+
     "<label class='f'>Your school (optional)</label><input class='in' id='pk' maxlength='80' value='"+esc(p.school||"")+"'>"+
     "<div class='err' id='e'></div><button class='btn p' id='go' style='width:100%;margin-top:10px'>Start the assessment</button>";
    $("go").onclick = () => {
      const v = {name:$("pn").value.trim(), grade:$("pg").value, state:$("ps").value, plan:$("pp").value, city:$("pc").value.trim(), school:$("pk").value.trim()};
      if(!v.name||!v.grade||!v.state||!v.city||!v.plan){ $("e").textContent="Please fill in your name, grade, state, city and study plan."; return; }
      S.profile = v; buildPages(); S.stage="test"; S.page=0; save(); render(); window.scrollTo(0,0);
    };
    return;
  }
  if(S.stage==="done"){
    $("bar").style.display="none"; nav.style.display="none";
    card.innerHTML = "<span class='pill'>COMPLETED</span><h1>Thank you, "+esc(S.profile.name||"")+"!</h1><p>You have completed the assessment. Your answers have been sent.</p>"+
      "<div class='note ok'>Your career report will be reviewed and sent to the email used at purchase. If you have any questions, please contact Konnect Career Clarity at konnectcareerclarity@gmail.com.</div>";
    return;
  }
  // test stage
  if(!PAGES.length) buildPages();
  const p = PAGES[S.page]; head();
  nav.style.display=""; back.disabled = S.page===0;
  const last = S.page===PAGES.length-1;
  if(!p.items.length){
    card.innerHTML = "<span class='pill'>"+(p.pause?"TAKE A BREAK":p.part.toUpperCase())+"</span><h2>"+esc(p.intro.title)+"</h2><p>"+esc(p.intro.body)+"</p>";
    next.textContent = p.pause ? "Continue to Part 3" : "Start"; next.disabled=false; return;
  }
  card.innerHTML = p.items.map(id => renderItem(byId[id])).join("");
  card.querySelectorAll(".q").forEach(bindQ);
  updateChrome();
}

function bindQ(q){
  const id = q.dataset.id;
  const redo = () => { save(); const nq = document.createElement("div"); nq.innerHTML = renderItem(byId[id]); const fresh = nq.firstChild; q.replaceWith(fresh); bindQ(fresh); updateChrome(); };
  q.querySelectorAll("[data-v]").forEach(btn => btn.onclick = () => { S.answers[id] = btn.dataset.v; redo(); });
  q.querySelectorAll("[data-m]").forEach(btn => btn.onclick = () => {
    let sel = Array.isArray(S.answers[id])?S.answers[id].slice():[]; const v = btn.dataset.m;
    if(sel.includes(v)) sel = sel.filter(x=>x!==v); else if(sel.length<3) sel.push(v); else { $("hint").textContent="You can choose up to 3."; return; }
    S.answers[id] = sel; redo(); });
  q.querySelectorAll("[data-skip]").forEach(btn => btn.onclick = () => { S.answers[id] = "SKIP"; redo(); });
  q.querySelectorAll("[data-text]").forEach(inp => inp.oninput = () => { S.answers[inp.dataset.text] = inp.value; save(); });
}

function updateChrome(){
  const p = PAGES[S.page]; if(!p || !p.items.length) return;
  head();
  const last = S.page===PAGES.length-1, ok = pageComplete(p);
  $("next").textContent = last ? "Submit" : "Next"; $("next").disabled = !ok;
  $("hint").textContent = ok ? "" : "Please answer every question on this page to continue.";
}
function _unused(){
}

$("next").onclick = () => {
  const p = PAGES[S.page];
  if(S.page===PAGES.length-1){ submit(); return; }
  S.page++; save(); render(); window.scrollTo(0,0);
};
$("back").onclick = () => { if(S.page>0){ S.page--; save(); render(); window.scrollTo(0,0); } };

function submit(){
  $("next").disabled = true; $("next").textContent = "Submitting...";
  const ids = new Set(PAGES.flatMap(p=>p.items));
  const out = {}; Object.keys(S.answers).forEach(k => { if(ids.has(k) || k==="CTX-5t") out[k] = S.answers[k]; });
  const payload = {action:"submitTest", token, version:FORM_VERSION, profile:S.profile, answers:out};
  if(demo){ S.stage="done"; render(); return; }
  fetch(WEBAPP_URL, {method:"POST", body:JSON.stringify(payload)})
    .then(() => { try{ localStorage.removeItem(key()); }catch(e){} S.stage="done"; render(); })
    .catch(() => { $("next").disabled=false; $("next").textContent="Submit"; $("hint").textContent="We could not send your answers. Please check your internet and press Submit again."; });
}

function gate(title, sub){
  $("bar").style.display="none"; $("nav").style.display="none";
  $("card").innerHTML = "<h1>"+title+"</h1><p>"+sub+"</p>";
}

(function init(){
  const q = new URLSearchParams(location.search);
  token = q.get("token");
  if(!WEBAPP_URL && q.get("demo")==="1"){ demo = true; token = "DEMO"; load(); if(S.stage==="test"||S.stage==="profile"){ buildPages(); } render(); return; }
  if(!token){ gate("This link needs an access code.","Please use the personal link sent to your email after payment. If you think this is a mistake, contact Konnect Career Clarity at konnectcareerclarity@gmail.com."); return; }
  if(!WEBAPP_URL){ gate("This assessment is not open yet.","It will open soon."); return; }
  $("card").innerHTML = "<h1>Checking your link...</h1><p class='sub'>One moment please.</p>";
  fetch(WEBAPP_URL+"?action=validateToken&token="+encodeURIComponent(token)).then(r=>r.json()).then(d=>{
    if(d.valid){ load(); if(S.stage==="test"||S.profile.grade){ buildPages(); } render(); }
    else if(d.reason==="already_used") gate("This link has already been used.","Each assessment link can be completed only once. Please contact Konnect Career Clarity if you need help.");
    else gate("We could not verify this link.","The link may be invalid or expired. Please contact Konnect Career Clarity for help.");
  }).catch(()=>gate("Connection problem.","We could not check your link. Please refresh the page or try again shortly."));
})();
</script>
