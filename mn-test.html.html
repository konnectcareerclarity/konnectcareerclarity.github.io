<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Merchant Navy Career Assessment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --deep-sea:#0E2A3F;
  --deep-sea-2:#123449;
  --foam:#F6F5F1;
  --ink:#14303F;
  --gold:#C9A24B;
  --teal:#2E8B87;
  --coral:#E4633F;
  --muted:#6C8494;
  --line:rgba(20,48,63,0.10);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  min-height:100vh;
  background:
    radial-gradient(1200px 600px at 15% -10%, rgba(46,139,135,0.28), transparent 60%),
    radial-gradient(900px 500px at 100% 110%, rgba(201,162,75,0.14), transparent 55%),
    var(--deep-sea);
  font-family:'Work Sans', sans-serif;
  color:var(--ink);
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:24px 16px 60px;
}
.headfont{font-family:'Fraunces', serif;}

/* ---- Top voyage progress ---- */
.voyage-wrap{
  width:100%;
  max-width:640px;
  margin-bottom:22px;
}
.voyage-top{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  color:var(--foam);
  font-size:12.5px;
  letter-spacing:.02em;
  margin-bottom:8px;
  opacity:.85;
}
.voyage-brand{
  font-family:'Fraunces', serif;
  font-size:15px;
  color:var(--foam);
  font-weight:600;
}
.voyage-track{
  position:relative;
  height:34px;
}
.voyage-line{
  position:absolute;
  top:16px; left:0; right:0;
  height:2px;
  background:rgba(246,245,241,0.22);
  border-radius:2px;
}
.voyage-line-fill{
  position:absolute;
  top:16px; left:0;
  height:2px;
  background:linear-gradient(90deg, var(--gold), #e7c877);
  border-radius:2px;
  transition:width .5s ease;
}
.voyage-port,.voyage-dest{
  position:absolute; top:6px;
  font-size:16px;
}
.voyage-port{left:-2px;}
.voyage-dest{right:-2px;}
.voyage-ship{
  position:absolute;
  top:1px;
  transform:translateX(-50%);
  font-size:20px;
  transition:left .5s ease;
  filter:drop-shadow(0 2px 4px rgba(0,0,0,.35));
}

/* ---- Card ---- */
.stage{
  width:100%;
  max-width:640px;
  min-height:420px;
  display:flex;
  flex-direction:column;
}
.card{
  background:var(--foam);
  border-radius:18px;
  padding:38px 34px 30px;
  box-shadow:0 24px 60px rgba(0,0,0,0.28);
  position:relative;
  overflow:hidden;
  flex:1;
  display:flex;
  flex-direction:column;
}
.card::before{
  content:"";
  position:absolute; top:0; left:0; right:0; height:5px;
  background:linear-gradient(90deg, var(--gold), var(--teal));
}
.eyebrow{
  font-size:13px;
  color:var(--teal);
  font-weight:600;
  margin-bottom:10px;
}
.qnum{
  font-size:12.5px;
  color:var(--muted);
  margin-bottom:6px;
}
.prompt{
  font-family:'Fraunces', serif;
  font-weight:600;
  font-size:23px;
  line-height:1.35;
  margin:0 0 26px;
  color:var(--ink);
}
.subnote{
  font-size:13.5px;
  color:var(--muted);
  margin:-16px 0 22px;
}

/* ---- Choice options (lettered) ---- */
.opt-list{
  display:flex;
  flex-direction:column;
  gap:10px;
  margin-bottom:8px;
}
.opt{
  display:flex;
  align-items:center;
  gap:14px;
  padding:14px 16px;
  border-radius:12px;
  border:1.5px solid var(--line);
  background:#fff;
  cursor:pointer;
  transition:all .15s ease;
  text-align:left;
  font-size:20px;
  line-height:1.4;
  font-family:'Work Sans', sans-serif;
  color:var(--ink);
}
.opt:hover{border-color:var(--teal);}
.opt .k{
  flex:0 0 26px;
  height:26px;
  width:26px;
  border-radius:50%;
  background:var(--deep-sea);
  color:var(--gold);
  font-size:12px;
  font-weight:700;
  display:flex;
  align-items:center;
  justify-content:center;
}
.opt.selected{
  background:var(--teal);
  border-color:var(--teal);
  color:#fff;
}
.opt.selected .k{
  background:#fff;
  color:var(--teal);
}

/* ---- Scale (Likert) ---- */
.scale-wrap{margin-bottom:8px;}
.scale-row{
  display:flex;
  justify-content:space-between;
  gap:8px;
}
.scale-btn{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:8px;
  padding:12px 4px 10px;
  border-radius:12px;
  border:1.5px solid var(--line);
  background:#fff;
  cursor:pointer;
  transition:all .15s ease;
}
.scale-btn:hover{border-color:var(--teal);}
.scale-btn .dot{
  width:30px;height:30px;border-radius:50%;
  background:var(--deep-sea-2);
  color:var(--gold);
  display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:13px;
}
.scale-btn .lbl{
  font-size:16px;
  color:var(--ink);
  text-align:center;
  line-height:1.25;
  min-height:34px;
}
.scale-btn.selected{
  border-color:var(--coral);
  background:rgba(228,99,63,0.08);
}
.scale-btn.selected .dot{
  background:var(--coral);
  color:#fff;
}

/* ---- Checkbox chips ---- */
.chip-wrap{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:10px;}
.chip{
  padding:10px 16px;
  border-radius:999px;
  border:1.5px solid var(--line);
  background:#fff;
  font-size:14px;
  cursor:pointer;
  transition:all .15s ease;
}
.chip.selected{background:var(--teal);border-color:var(--teal);color:#fff;}
.chip.disabled{opacity:.4; cursor:not-allowed;}
.other-input{
  margin-top:10px;
  width:100%;
  padding:12px 14px;
  border-radius:10px;
  border:1.5px solid var(--line);
  font-family:'Work Sans',sans-serif;
  font-size:14px;
}

/* ---- Text / number input ---- */
.text-input{
  width:100%;
  padding:14px 16px;
  border-radius:12px;
  border:1.5px solid var(--line);
  font-family:'Work Sans',sans-serif;
  font-size:16px;
  margin-bottom:8px;
}

/* ---- Intro / end screens ---- */
.intro-screen{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  justify-content:center;
}
.intro-mark{font-size:34px;margin-bottom:14px;}
.intro-title{
  font-family:'Fraunces', serif;
  font-weight:700;
  font-size:28px;
  margin:0 0 12px;
}
.intro-sub{
  font-size:15px;
  color:var(--muted);
  line-height:1.55;
  max-width:460px;
}
.start-screen{align-items:center; text-align:center;}
.start-screen .intro-sub{max-width:420px;}

/* ---- Footer nav ---- */
.nav-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:24px;
}
.btn{
  font-family:'Work Sans', sans-serif;
  font-weight:600;
  font-size:15px;
  padding:13px 26px;
  border-radius:999px;
  border:none;
  cursor:pointer;
  transition:all .15s ease;
}
.btn-primary{
  background:var(--gold);
  color:var(--deep-sea);
}
.btn-primary:hover{filter:brightness(1.06);}
.btn-primary:disabled{
  background:#cfd3d1;
  color:#8a9290;
  cursor:not-allowed;
}
.btn-ghost{
  background:transparent;
  color:var(--foam);
  padding:13px 14px;
}
.btn-ghost:disabled{opacity:0; pointer-events:none;}

/* ---- Completion ---- */
.done-wrap{text-align:center;}
.done-emoji{font-size:46px;margin-bottom:10px;}
.copy-box{
  background:#fff;
  border:1.5px solid var(--line);
  border-radius:12px;
  padding:12px;
  font-size:11.5px;
  font-family:monospace;
  max-height:180px;
  overflow:auto;
  text-align:left;
  white-space:pre-wrap;
  word-break:break-all;
  margin:18px 0;
}
.copied-msg{color:var(--teal); font-size:13px; font-weight:600; height:18px;}


.brand-logo{
  height:30px;
  width:30px;
  border-radius:8px;
  object-fit:cover;
  box-shadow:0 2px 8px rgba(0,0,0,.35);
}
.start-logo{
  height:64px;
  width:64px;
  border-radius:16px;
  object-fit:cover;
  box-shadow:0 8px 20px rgba(0,0,0,.35);
  margin-bottom:16px;
}


/* ---- Question numbering + navigator (added) ---- */
.qcounter{
  font-size:12.5px;
  color:var(--muted);
  margin-bottom:6px;
  font-weight:600;
}
.navigator{
  display:flex;
  gap:5px;
  overflow-x:auto;
  padding:10px 2px 4px;
  margin-top:18px;
  border-top:1px solid var(--line);
}
.navigator::-webkit-scrollbar{height:4px;}
.nav-dot{
  flex:0 0 26px;
  height:26px;
  border-radius:7px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:10px;
  font-weight:700;
  cursor:pointer;
  color:#fff;
  background:#D9503F;
  transition:transform .1s ease;
}
.nav-dot.answered{background:#2E8B57;}
.nav-dot.current{outline:2px solid var(--gold); outline-offset:1px;}
.nav-dot:hover{transform:scale(1.08);}

/* ---- Combined profile form (added) ---- */
.pform-field{margin-bottom:16px;}
.pform-label{
  font-size:13.5px;
  font-weight:600;
  color:var(--ink);
  margin-bottom:6px;
  display:block;
}
.pform-input{
  width:100%;
  padding:12px 14px;
  border-radius:10px;
  border:1.5px solid var(--line);
  font-family:'Work Sans',sans-serif;
  font-size:15px;
}
.pform-input:focus{outline:none; border-color:var(--teal);}
.pform-error{
  color:var(--coral);
  font-size:12px;
  margin-top:4px;
}

/* ---- Part-complete encouragement badge (added) ---- */
.encourage-badge{
  display:inline-block;
  background:rgba(46,139,135,0.12);
  color:var(--teal);
  font-size:13px;
  font-weight:600;
  padding:6px 14px;
  border-radius:999px;
  margin-bottom:16px;
}

/* ---- Review/Submit screen (added) ---- */
.review-count{
  font-family:'Fraunces',serif;
  font-size:22px;
  font-weight:600;
  color:var(--teal);
  margin:10px 0 18px;
}

/* ---- Start screen: MERCHANT NAVY CAREER ASSESSMENT is the big headline, tagline is small ---- */
.start-headline{
  font-family:'Fraunces', serif;
  font-weight:700;
  font-size:30px;
  letter-spacing:.01em;
  color:var(--ink);
  margin:0 0 14px;
  line-height:1.25;
}
.start-tagline{
  font-size:13.5px;
  font-weight:600;
  color:var(--teal);
  letter-spacing:.03em;
  text-transform:uppercase;
  margin-bottom:16px;
}

@media (max-width:480px){

  .card{padding:28px 20px 24px;}
  .prompt{font-size:19px;}
  .scale-row{gap:5px;}
  .scale-btn .lbl{font-size:13px; min-height:30px; color:var(--ink);}
  .opt{font-size:16px;}
}
</style>
</head>

// A. LIFE AT SEA
screens.push(S('A1','A sea-going career may mean being away from home for several months at a time. How comfortable are you with this idea?',COMFORT5));
screens.push(C('A2','Imagine you are at sea and have very limited internet access for several days. What would be closest to your reaction?',[
  ['a','I would adjust easily and keep myself occupied.'],
  ['b','I would miss being connected, but I would manage.'],
  ['c','I would find it quite difficult and keep thinking about getting online again.'],
  ['d','I would find the situation very difficult to handle.']
]));

screens.push(S('A4','When I am away from my familiar surroundings for a long period, I can maintain my routine and keep myself occupied.',AGREE5));
screens.push(S('A5','Missing important occasions at home because I am at sea would be difficult for me.',AGREE5));
screens.push(C('A6','Which situation would be more difficult for you?',[

  ['b','Following the same routine for long periods'],
  ['c','Working in uncomfortable weather and physical conditions'],
  ['d','Living with the same people for a long time'],
  ['e','None of these would be particularly difficult for me']

// B. DISCIPLINE
screens.push(S('B1','I am comfortable working within a clear chain of responsibility, where different people have clearly defined duties.',AGREE5B));
screens.push(S('B2','How comfortable are you with a workday that includes fixed duty periods, watches, drills, inspections and scheduled tasks?',COMFORT5B));
screens.push(C('B3','You are asked to follow a safety procedure you have already performed many times. What are you most likely to do?',[
  ['a','Follow each step properly every time.'],

  ['c','Skip steps that seem unnecessary if the task is routine.'],
  ['d','Ask someone else to handle it if possible.']
]));

// ---------- State ----------
let idx = 0;
const answers = {};
const totalScored = screens.filter(s => s.id).length;

function scoredIndexOf(i){
  let n = 0;
  for(let k=0;k<i;k++){ if(screens[k].id) n++; }
  return n;
}

// ---------- Core question numbering / navigator / autosave (added) ----------
const coreScreenIndices = [];
screens.forEach((s,i)=>{ if(s.core===true && s.id){ coreScreenIndices.push(i); } });
const coreTotal = coreScreenIndices.length;

function coreNumberOf(i){ return coreScreenIndices.indexOf(i) + 1; }

function isAnswered(sid){
  const a = answers[sid];
  if(a===undefined || a===null || a==='') return false;
  if(Array.isArray(a)) return a.length>0;
  return true;
}

function countAnsweredCore(){
  let n=0;
  coreScreenIndices.forEach(i=>{ if(isAnswered(screens[i].id)) n++; });
  return n;
}

function navigatorHTML(){
  let h = '<div class="navigator">';
  coreScreenIndices.forEach((si,ci)=>{
    const answered = isAnswered(screens[si].id);
    const isCurrent = (si===idx);
    h += '<div class="nav-dot'+(answered?' answered':'')+(isCurrent?' current':'')+'" data-si="'+si+'">'+(ci+1)+'</div>';
  });
  h += '</div>';
  return h;
}

function attachNavigatorEvents(){
  document.querySelectorAll('.nav-dot').forEach(dot=>{
    dot.onclick = ()=>{ idx = parseInt(dot.getAttribute('data-si')); render(); window.scrollTo(0,0); };
  });
}

function saveProgress(){
  try{
    if(currentToken){ localStorage.setItem('mnTestProgress_'+currentToken, JSON.stringify({idx:idx, answers:answers})); }
  }catch(e){}
}
function loadProgress(){
  try{
    if(currentToken){
      const raw = localStorage.getItem('mnTestProgress_'+currentToken);
      if(raw){
        const data = JSON.parse(raw);
        if(data && data.answers){
          Object.assign(answers, data.answers);
          if(typeof data.idx==='number' && data.idx>=0 && data.idx<screens.length){ idx = data.idx; }
        }
      }
    }
  }catch(e){}
}
function clearProgress(){
  try{ if(currentToken){ localStorage.removeItem('mnTestProgress_'+currentToken); } }catch(e){}
}

      <div class="subnote">Select up to 3.</div>
      <div class="chip-wrap" id="chipWrap"></div>
      <input class="other-input" id="otherInput" placeholder="Other (optional)" value="${answers[s.id+'_other']||''}">` + (s.core ? navigatorHTML() : '');
    const wrap = document.getElementById('chipWrap');
    s.opts.forEach(opt=>{
      const chip = document.createElement('div');
      const sel = answers[s.id].includes(opt);
      const full = answers[s.id].length>=3 && !sel;
      chip.className = 'chip'+(sel?' selected':'')+(full?' disabled':'');
      chip.textContent = opt;
      chip.onclick = ()=>{
        if(sel){ answers[s.id]=answers[s.id].filter(o=>o!==opt); saveProgress(); render(); }
        else if(answers[s.id].length<3){ answers[s.id].push(opt); saveProgress(); render(); }
      };
      wrap.appendChild(chip);
    });
    document.getElementById('otherInput').oninput = (e)=>{ answers[s.id+'_other']=e.target.value; saveProgress(); };
    if(s.core) attachNavigatorEvents();
  }

  if(s.type==='text' || s.type==='number'){
    card.innerHTML = `
      <div class="qcounter">A few details</div>
      <div class="prompt">${s.prompt}</div>
      <input class="text-input" id="txtInput" type="${s.type==='number'?'number':'text'}" placeholder="${s.placeholder}" value="${answers[s.id]||''}">`;
    document.getElementById('txtInput').oninput = (e)=>{ answers[s.id]=e.target.value; saveProgress(); updateNextState(); };
  }

  if(s.type==='profileForm'){
    card.innerHTML = `
      <div class="qcounter">About You</div>
      <div class="prompt">Your Details</div>
      <div id="pformFields"></div>`;
    const wrap = document.getElementById('pformFields');
    s.fields.forEach(field=>{
      const div = document.createElement('div');
      div.className = 'pform-field';
      let inputHtml = '';
      if(field.type==='select'){
        inputHtml = '<select class="pform-input" id="pf_'+field.id+'"><option value="">Select...</option>' +
          field.options.map(([k,t])=>'<option value="'+k+'"'+(answers[field.id]===k?' selected':'')+'>'+t+'</option>').join('') +
          '</select>';
      } else {
        inputHtml = '<input class="pform-input" id="pf_'+field.id+'" type="'+field.type+'" value="'+(answers[field.id]||'')+'">';
      }
      div.innerHTML = '<label class="pform-label">'+field.label+'</label>'+inputHtml+'<div class="pform-error" id="err_'+field.id+'"></div>';
      wrap.appendChild(div);
    });
    s.fields.forEach(field=>{
      const el = document.getElementById('pf_'+field.id);
      el.addEventListener('input', updatePFormState);
      el.addEventListener('change', updatePFormState);
    });
    updatePFormState();
  }

  updateNextState();
  nextBtn.textContent = 'Continue';

  function updateNextState(){
    const optional = ['A6','C6','B7','P4']; // diagnostic-only / optional fields
    if(optional.includes(s.id)){ nextBtn.disabled=false; return; }
    if(s.type==='checkbox3'){ nextBtn.disabled = answers[s.id].length===0; return; }
    nextBtn.disabled = (answers[s.id]===undefined || answers[s.id]==='');
  }
}

function updatePFormState(){
  const s = screens[idx];
  if(!s || s.type!=='profileForm') return;
  let allValid = true;
  s.fields.forEach(field=>{
    const el = document.getElementById('pf_'+field.id);
    if(!el) return;
    const val = el.value.trim();
    answers[field.id] = val;
    const errEl = document.getElementById('err_'+field.id);
    let err = '';
    if(val===''){
      if(field.required) allValid = false;
    } else if(field.id==='PHONE'){
      if(!/^[6-9]\d{9}$/.test(val)){ err='Enter a valid 10-digit mobile number'; allValid=false; }
    } else if(field.id==='EMAIL'){
      if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val)){ err='Enter a valid email address'; allValid=false; }
    }
    if(errEl) errEl.textContent = err;
  });
  document.getElementById('nextBtn').disabled = !allValid;
  saveProgress();
}

document.getElementById('nextBtn').addEventListener('click', ()=>{
  const leavingReview = screens[idx] && screens[idx].type==='reviewSubmit';
  if(idx < screens.length-1){
    idx++;
    render();
    window.scrollTo(0,0);
    if(leavingReview){ submitAnswers(); }
  }
});
document.getElementById('backBtn').addEventListener('click', ()=>{
  if(idx>0){ idx--; render(); window.scrollTo(0,0); }
});

function submitAnswers(){
  if(isDemoMode){ return; } // preview mode - don't write fake data to the real Sheet
  try{
    fetch(WEBAPP_URL, {
      method:'POST',
      body: JSON.stringify({ action:'submitTest', token: currentToken, answers: answers })
    }).then(()=>{ clearProgress(); }).catch(()=>{ /* fail silently for the student; data attempt was made */ });
  }catch(e){}
}

function showGateMessage(title, sub){
  document.getElementById('card').innerHTML = `
    <div class="intro-screen start-screen">
      <div class="intro-mark">🔒</div>
      <h1 class="intro-title">${title}</h1>
      <p class="intro-sub">${sub}</p>
    </div>`;
  document.getElementById('nextBtn').style.display='none';
  document.getElementById('backBtn').style.display='none';
}

let isDemoMode = false;

function initGate(){
  const params = new URLSearchParams(window.location.search);
  const token = params.get('token');

  document.getElementById('nextBtn').style.display='none';
  document.getElementById('backBtn').style.display='none';

  // Preview-only bypass: only ever active inside Claude's own preview iframe domain,
  // never on the real konnectcareerclarity.com site. Lets Ritu click through here safely.
  if(window.location.hostname.indexOf('claudeusercontent.com')!==-1){
    isDemoMode = true;
    currentToken = 'DEMO';
    document.getElementById('nextBtn').style.display='';
    document.getElementById('backBtn').style.display='';
    render();
    return;
  }

  if(!token){
    showGateMessage('This link needs an access code.', 'Please use the personal link sent to your email after payment. If you believe this is an error, contact Konnect Career Clarity.<br><br><span style="font-size:11px;opacity:.6;">Debug info — full URL: '+window.location.href+'<br>Query string seen: "'+window.location.search+'"</span>');
    return;
  }

  document.getElementById('card').innerHTML = `
    <div class="intro-screen start-screen">
      <div class="intro-mark">⚓</div>
      <h1 class="intro-title">Checking your link…</h1>
      <p class="intro-sub">One moment please.</p>
    </div>`;

  fetch(WEBAPP_URL + '?action=validateToken&token=' + encodeURIComponent(token))
    .then(r=>r.json())
    .then(data=>{
      if(data.valid){
        currentToken = token;
        loadProgress();
        document.getElementById('nextBtn').style.display='';
        document.getElementById('backBtn').style.display='';
        render();
      } else if(data.reason==='already_used'){
        showGateMessage('This link has already been used.', 'Each assessment link can only be completed once. If you need help, please contact Konnect Career Clarity.');
      } else {
        showGateMessage('We couldn\'t verify this link.', 'This link may be invalid or expired. Please contact Konnect Career Clarity for help.');
      }
    })
    .catch(()=>{
      showGateMessage('Connection problem.', 'We couldn\'t verify your link right now. Please refresh the page or try again shortly.');
    });
}

initGate();
</script>
